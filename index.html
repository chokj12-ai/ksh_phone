<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>뱅땅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;aspect-ratio:534/949;height:min(100dvh,calc(100vw*949/534));overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .3s ease}
.screen.active{opacity:1;pointer-events:auto}
.screen img{width:100%;height:100%;display:block;object-fit:fill;-webkit-user-drag:none}
#lock.leaving{transform:translateY(-8%);opacity:0}
.hot{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;outline:0}
.hot:active{background:rgba(255,255,255,.18);border-radius:10px}
#lock .hot{inset:0;border-radius:0}
#lock .hot:active{background:transparent}
#home .msg{left:77%;top:84.2%;width:14.5%;height:11.5%}
#msg .back{left:2.5%;top:5.2%;width:12.5%;height:6.5%}
#msg .home-btn{left:30%;top:97%;width:40%;height:3%}

#chat{display:flex;flex-direction:column;background:#000;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#chat .sb{flex:0 0 4.215%;background-repeat:no-repeat;background-position:top left;background-size:100% auto;background-color:#000}
#chat .title{flex:0 0 9.8%;position:relative;background:linear-gradient(#2c363c,#141a1d);border-bottom:1px solid #000;color:#fff}
#chat .title .bk{position:absolute;left:1.5%;top:0;width:7%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;cursor:pointer}
#chat .title .bk:active{background:rgba(255,255,255,.15)}
#chat .title .bk svg{width:46%;height:auto}
#chat .title .env{position:absolute;left:8.6%;top:50%;width:9.4%;aspect-ratio:110/107;transform:translateY(-50%);background-repeat:no-repeat;background-size:972.7% auto;background-position:4.17% 6.03%}
#chat .title .nm{position:absolute;left:20.5%;right:18%;top:0;height:100%;display:flex;align-items:center;font-weight:700;font-size:calc(var(--u)*4.7);white-space:nowrap;overflow:hidden}
#chat .title .tr{position:absolute;right:0;top:12%;height:76%;width:15%;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.14)}
#chat .title .tr svg{width:42%;height:auto}
#chat .list{flex:1 1 0;min-height:0;overflow-y:auto;padding:calc(var(--u)*3) 0 calc(var(--u)*3);scrollbar-width:none}
#chat .list::-webkit-scrollbar{display:none}
#chat .dv{text-align:center;color:#8d8d8d;font-size:calc(var(--u)*3.4);margin:calc(var(--u)*4) 0 calc(var(--u)*3)}
#chat .row{display:flex;align-items:flex-end;margin:calc(var(--u)*2.2) 0}
#chat .row.c{justify-content:flex-start;padding-left:4.2%}
#chat .row.k{justify-content:flex-end;padding-right:4.2%}
#chat .bub{position:relative;max-width:72%;padding:calc(var(--u)*2.6) calc(var(--u)*3);border-radius:calc(var(--u)*1.8);color:#000;font-size:calc(var(--u)*4.2);line-height:1.38;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
#chat .row.c .bub{background:#e8e766;margin-left:calc(var(--u)*2.6);border-bottom-left-radius:0}
#chat .row.k .bub{background:#8fcbee;margin-right:calc(var(--u)*2.6);border-bottom-right-radius:0}
#chat .bub::after{content:"";position:absolute;bottom:0;width:calc(var(--u)*2.6);height:calc(var(--u)*3.4)}
#chat .row.c .bub::after{left:calc(var(--u)*-2.5);background:#e8e766;clip-path:polygon(100% 0,100% 100%,0 100%)}
#chat .row.k .bub::after{right:calc(var(--u)*-2.5);background:#8fcbee;clip-path:polygon(0 0,0 100%,100% 100%)}
#chat .tm{color:#9a9a9a;font-size:calc(var(--u)*3.4);line-height:1;white-space:nowrap;padding:0 calc(var(--u)*2.2) calc(var(--u)*.4)}
#chat .row.k .tm{order:-1}
#chat .inp{flex:0 0 8.4%;display:flex;align-items:center;gap:2.2%;padding:0 2.5%;background:#000;border-top:1px solid #1c1c1c}
#chat .inp .box{flex:1;height:78%;border:2px solid #f2f2f2;background:#000;color:#bdbdbd;font-size:calc(var(--u)*4.2);display:flex;align-items:center;padding-left:calc(var(--u)*3);box-sizing:border-box}
#chat .inp .clip{flex:0 0 15.5%;height:78%;background:#3a3a3a;border:1px solid #555;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#chat .inp .clip svg{width:42%;height:auto}
#msg .row1{left:0;top:12.9%;width:100%;height:9.9%;border-radius:0}

#call{display:flex;flex-direction:column;background:#060606;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#fff}
#call .sb{flex:0 0 4.215%;background-repeat:no-repeat;background-position:top left;background-size:100% auto;background-color:#000}
#call .tabs{flex:0 0 auto;height:calc(var(--u)*17.6);display:flex;background:linear-gradient(#1f3a4f,#223544)}
#call .tab{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.9);border-left:1px solid rgba(255,255,255,.07)}
#call .tab:first-child{border-left:0}
#call .tab img{height:calc(var(--u)*8.2);width:auto;display:block}
#call .tab span{font-size:calc(var(--u)*4.3);font-weight:500;line-height:1;white-space:nowrap;color:#fff}
#call .tab.on{background:linear-gradient(#467da6,#407199);border-left:0;border-bottom:calc(var(--u)*.6) solid #327eb2}
#call .cl{flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:none}
#call .cl::-webkit-scrollbar{display:none}
#call .hd{height:calc(var(--u)*6.7);display:flex;align-items:center;padding-left:4.8%;font-size:calc(var(--u)*4.1);color:#d3d9de;background:linear-gradient(#21313e,#141d24)}
#call .cr{position:relative;height:calc(var(--u)*18);margin-left:.9%;border-bottom:1px solid #3a3a3a}
#call .cr .av{position:absolute;left:0;top:6%;height:88%;width:auto}
#call .cr .nm{position:absolute;left:18.6%;top:7%;font-size:calc(var(--u)*5.5);line-height:1.25;white-space:nowrap;color:#fff;max-width:62%;overflow:hidden}
#call .cr .dr{position:absolute;left:18.4%;top:49%;height:33%;width:auto}
#call .cr .no{position:absolute;left:30.5%;top:50%;font-size:calc(var(--u)*4.4);line-height:1.3;color:#c4c4c4;white-space:nowrap}
#call .cr .tm{position:absolute;right:17.5%;top:51%;font-size:calc(var(--u)*4.4);line-height:1.3;color:#35a9de;white-space:nowrap}
#call .cr .ct{position:absolute;right:17.5%;top:11%;font-size:calc(var(--u)*4.1);line-height:1.3;color:#e2e2e2;white-space:nowrap}
#call .cr .vl{position:absolute;left:84.9%;top:8%;height:84%;width:1px;background:#3a3a3a}
#call .cr .ph{position:absolute;right:3.6%;top:50%;height:42%;width:auto;transform:translateY(-50%)}
#call .hb{left:30%;top:96%;width:40%;height:4%}
#home .tel{left:7%;top:84.5%;width:15.5%;height:11.3%}
</style></head><body>

<script>
const S={lock:document.getElementById('lock'),home:document.getElementById('home'),msg:document.getElementById('msg'),chat:document.getElementById('chat'),call:document.getElementById('call')};
const phone=document.getElementById('phone');
let cur='lock';
function go(n){
  if(n===cur)return;
  if(cur==='lock')S.lock.classList.add('leaving');
  S[cur].classList.remove('active');
  S[n].classList.add('active');
  if(n==='lock')S.lock.classList.remove('leaving');
  cur=n;
  if(n==='chat'){const l=document.getElementById('chatlist');l.scrollTop=l.scrollHeight;}
}
function fit(){phone.style.setProperty('--u',(phone.clientWidth/100)+'px');}
fit();addEventListener('resize',fit);
// 상단 상태바(3G)와 편지 아이콘은 메시지함 이미지를 그대로 사용
const msgSrc=S.msg.querySelector('img').src;
S.chat.querySelector('.sb').style.backgroundImage='url('+msgSrc+')';
S.chat.querySelector('.env').style.backgroundImage='url('+msgSrc+')';
// 잠금화면: 탭 or 드래그하면 해제
const lb=S.lock.querySelector('.hot');
let sx=null,sy=null;
lb.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
lb.addEventListener('pointermove',e=>{if(sx!==null&&Math.hypot(e.clientX-sx,e.clientY-sy)>24){sx=null;go('home')}});
lb.addEventListener('pointerup',()=>{if(sx!==null){sx=null;go('home')}});
S.home.querySelector('.msg').addEventListener('click',()=>go('msg'));
S.msg.querySelectorAll('.back,.home-btn').forEach(b=>b.addEventListener('click',()=>go('home')));
S.msg.querySelector('.row1').addEventListener('click',()=>go('chat'));
S.chat.querySelector('.bk').addEventListener('click',()=>go('msg'));
// 대화 내용 (c: 차병호 / 노란색, k: 김상훈 / 파란색)
const CHAT=[
 {d:'03/17 월',m:[['c','김상훈 일병님, 저 차병호입니다.','오후 2:11'],['k','ㅇㅋ','오후 3:40']]},
 {d:'09/08 월',m:[['c','김상훈 병장님, 저 오늘 복귀합니다.','오전 9:32'],['k','ㅇㅋ','오전 11:05']]},
 {d:'02/21 토',m:[
  ['c','저 병장달앗습니다!!!!!!','오후 12:20'],
  ['k','ㅋㅋ 좋냐','오후 1:45'],
  ['c','좋습니다ㅎㅎ 말출나왔지 말입니다.','오후 3:10'],
  ['k','재밋게 놀고 조심히 복귀해라~','오후 4:50'],
  ['c','넵','오후 6:15']]},
 {d:'05/14 목',m:[
  ['c','김상훈병장님 안계시니까 심심합니다ㅜ','오전 10:05'],
  ['k','뭐가 심심해 임마~~','오전 11:30'],
  ['c','다들 축구를 못해요','오후 12:50'],
  ['k','요? 개빠졋네ㅋㅋ','오후 2:10'],
  ['c','아ㅜㅜㅜㅜ 왜그러십니까','오후 3:40'],
  ['k','폰 어케쓰는데','오후 5:05'],
  ['c','다 방법이 잇습니다','오후 6:30'],
  ['k','부소댐한테 전화한다?','오후 7:55'],
  ['c','아ㅜ','오후 9:10']]},
 {d:'10/16 금',m:[['c','형 괜찮아요??','오후 1:23']]}
];
(function(){
  const l=document.getElementById('chatlist');
  CHAT.forEach(day=>{
    const dv=document.createElement('div');dv.className='dv';dv.textContent=day.d;l.appendChild(dv);
    day.m.forEach(([w,t,tm])=>{
      const r=document.createElement('div');r.className='row '+w;
      const b=document.createElement('div');b.className='bub';b.textContent=t;
      const s=document.createElement('div');s.className='tm';s.textContent=tm;
      r.appendChild(b);r.appendChild(s);l.appendChild(r);
    });

// 통화 기록 (g: 초록 왼쪽 화살표 / r: 빨간 오른쪽 화살표)
const CALLS=[
 {h:'오늘'},
 {n:'차병호(신화부대)',a:'g',t:'오후 1:15',p:'blue'},
 {n:'차병호(신화부대)',a:'g',t:'오후 12:32',p:'blue'},
 {n:'병남이',a:'g',c:3,t:'오전 8:49',p:'blue'},
 {n:'김현승(현장)',a:'r',c:3,t:'오전 5:06',p:'beige'},
 {n:'반장님',a:'g',c:2,t:'오전 2:58',p:'blue'},
 {h:'어제'},
 {n:'엄마',a:'g',t:'오후 11:41',p:'blue'},
 {n:'1544-1111',num:1,a:'r',t:'오후 2:15',p:'pink'}
];
(function(){
  const l=document.getElementById('calllist');
  CALLS.forEach(c=>{
    const d=document.createElement('div');
    if(c.h){d.className='hd';d.textContent=c.h;l.appendChild(d);return}
    d.className='cr';
    d.innerHTML='<img class="av" alt="" src="'+CIMG[c.p]+'">'
      +'<div class="nm"></div>'
      +'<img class="dr" alt="" src="'+(c.a==='g'?CIMG.sg:CIMG.sr)+'">'
      +(c.num?'<div class="no"></div>':'')
      +(c.c?'<div class="ct">('+c.c+')</div>':'')
      +'<div class="tm"></div><div class="vl"></div>'
      +'<img class="ph" alt="" src="'+CIMG.call+'">';
    d.querySelector('.nm').textContent=c.n;
    if(c.num)d.querySelector('.no').textContent=c.n;
    d.querySelector('.tm').textContent=c.t;
    l.appendChild(d);
  });
})();
S.home.querySelector('.tel').addEventListener('click',()=>go('call'));
S.call.querySelector('.hb').addEventListener('click',()=>go('home'));
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(cur==='chat')go('msg');else if(cur==='call')go('home');else if(cur==='msg')go('home');else if(cur==='home')go('lock')}});
